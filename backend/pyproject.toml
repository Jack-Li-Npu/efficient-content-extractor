[project]
name = "youtube-extractor-local"
version = "2.0.0"
description = "Local caption-only adaptation of samueladegoke/yt-transcript-web"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "requests[socks]>=2.32,<3",
  "youtube-transcript-api>=1.2.4,<2",
  "yt-dlp[default]>=2026.3.17",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
